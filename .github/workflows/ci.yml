name: ci
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn registry:validate
      - run: yarn install --immutable
        working-directory: apps/example
      - run: yarn example:sync
      - run: yarn tsc --noEmit
        working-directory: apps/example
      - run: yarn install --immutable
        working-directory: apps/docs
      - run: yarn build
        working-directory: apps/docs
